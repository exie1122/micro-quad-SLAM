# Safe template for /etc/micro-quad-autonomy/autonomy.conf.
# The shipped value deliberately blocks live startup until an operator edits it.
ALLOW_LIVE_SERIAL=no
MAVLINK_DEVICE=/dev/ttyS2
MAVLINK_BAUD=57600
MAVLINK_TARGET_SYSTEM=1
MAVLINK_TARGET_COMPONENT=1
TOF_DEVICE=/dev/ttyS1
TOF_BAUD=115200
TOF_PROTOCOL=legacy-a5-v0
MAP_SOURCE=live
EXPLORATION_ENABLED=no
LOG_ROOT=/var/log/micro-quad-autonomy
AUTONOMY_BIN=/opt/micro-quad-autonomy/bin/autonomy_controller
SOURCE_COMMIT_FILE=/opt/micro-quad-autonomy/SOURCE_COMMIT
